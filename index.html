<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seed to Slice | Customer Orders</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #f7f3eb;
    color: #332e28;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 35px 20px 50px;
}

header {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 65px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    font-size: 30px;
}

.logo-name {
    font-family: Georgia, serif;
    font-size: 25px;
    font-weight: bold;
}

.logo-subtitle {
    color: #92877a;
    font-size: 11px;
    margin-top: 3px;
}

.shop-status {
    color: #667c5e;
    font-size: 12px;
    background: #e8eee3;
    padding: 9px 14px;
    border-radius: 20px;
}

.welcome {
    text-align: center;
    margin-bottom: 35px;
}

.welcome-label {
    color: #c65a42;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
}

h1 {
    font-family: Georgia, serif;
    font-size: clamp(38px, 6vw, 54px);
    font-weight: normal;
    margin: 13px 0;
    letter-spacing: -1px;
}

.welcome p {
    color: #847b70;
    font-size: 14px;
    line-height: 1.6;
}

.printer {
    width: 100%;
    max-width: 430px;
    background: #e7dfd2;
    border-radius: 22px;
    padding: 22px 22px 25px;
    box-shadow: 0 12px 35px rgba(55, 43, 28, 0.09);
    border: 1px solid #ddd3c5;
}

.printer-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 17px;
}

.printer-name {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.5px;
    color: #81766a;
    text-transform: uppercase;
}

.printer-light {
    width: 9px;
    height: 9px;
    background: #83a477;
    border-radius: 50%;
}

.slot {
    height: 12px;
    background: #bdb3a5;
    border-radius: 10px;
    margin: 0 15px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.2);
}

.receipt-area {
    padding: 0 10px;
    min-height: 390px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.receipt {
    width: 100%;
    max-width: 310px;
    min-height: 355px;
    background: #fffefa;
    padding: 26px 25px 30px;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
    position: relative;
    transform: translateY(-2px);

    clip-path: polygon(
        0 0, 100% 0, 100% 97%,
        96% 100%, 92% 97%, 88% 100%,
        84% 97%, 80% 100%, 76% 97%,
        72% 100%, 68% 97%, 64% 100%,
        60% 97%, 56% 100%, 52% 97%,
        48% 100%, 44% 97%, 40% 100%,
        36% 97%, 32% 100%, 28% 97%,
        24% 100%, 20% 97%, 16% 100%,
        12% 97%, 8% 100%, 4% 97%, 0 100%
    );
}

.receipt-placeholder {
    min-height: 320px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #a39a8e;
}

.placeholder-icon {
    font-size: 40px;
    margin-bottom: 15px;
}

.placeholder-title {
    font-family: Georgia, serif;
    font-size: 20px;
    color: #6f6559;
    margin-bottom: 8px;
}

.placeholder-text {
    font-size: 12px;
    line-height: 1.5;
}

.receipt-header {
    text-align: center;
    padding-bottom: 16px;
    border-bottom: 1px dashed #cfc6b9;
}

.receipt-logo {
    font-family: Georgia, serif;
    font-size: 24px;
    font-weight: bold;
}

.receipt-tagline {
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #93887b;
    margin-top: 5px;
}

.receipt-info {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #82786c;
    margin: 15px 0;
}

.customer {
    margin-bottom: 18px;
}

.small-heading {
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 1.5px;
    color: #a09689;
    margin-bottom: 7px;
}

.customer-name {
    font-family: Georgia, serif;
    font-size: 19px;
}

.order-name {
    font-family: Georgia, serif;
    font-size: 25px;
    line-height: 1.1;
    margin: 8px 0;
}

.order-description {
    font-size: 11px;
    color: #8c8175;
    line-height: 1.5;
}

.ingredients {
    margin-top: 20px;
}

.ingredient-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 7px 0;
    border-bottom: 1px dotted #e4ddd3;
}

.ingredient-amount {
    color: #93887b;
}

.receipt-bottom {
    text-align: center;
    font-size: 10px;
    color: #93887b;
    line-height: 1.6;
    border-top: 1px dashed #cfc6b9;
    margin-top: 20px;
    padding-top: 13px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.new-order {
    background: #d85d43;
    color: white;
    flex: 1;
}

.new-order:hover {
    background: #b94732;
    transform: translateY(-2px);
}

.copy-order {
    background: #f8f4ed;
    color: #655c51;
    border: 1px solid #d9d0c4;
}

.copy-order:hover {
    background: #eee7dc;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

button:focus-visible {
    outline: 3px solid #dca08f;
    outline-offset: 3px;
}

.message {
    min-height: 20px;
    text-align: center;
    color: #71866a;
    font-size: 11px;
    margin-top: 12px;
}

.print-animation {
    animation: printReceipt .55s ease-out;
}

@keyframes printReceipt {
    from {
        opacity: 0;
        transform: translateY(-25px);
    }

    to {
        opacity: 1;
        transform: translateY(-2px);
    }
}

footer {
    text-align: center;
    color: #a09689;
    font-size: 11px;
    margin-top: 30px;
    line-height: 1.7;
}

@media(max-width: 500px) {
    body {
        padding: 25px 14px;
    }

    header {
        margin-bottom: 45px;
    }

    .printer {
        padding: 17px 12px 20px;
    }

    .receipt-area {
        padding: 0 5px;
    }

    .receipt {
        padding: 23px 19px 30px;
    }

    .shop-status {
        font-size: 10px;
    }
}

@media print {
    body {
        background: white;
        padding: 0;
    }

    header, .welcome, .printer-top, .slot,
    .buttons, .message, footer {
        display: none !important;
    }

    .printer {
        background: white;
        border: none;
        box-shadow: none;
        padding: 0;
    }

    .receipt-area {
        min-height: auto;
    }

    .receipt {
        box-shadow: none;
        clip-path: none;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <div class="logo-icon">🍕</div>
        <div>
            <div class="logo-name">Seed to Slice</div>
        </div>
    </div>

</header>

<section class="welcome">
    <div class="welcome-label">Welcome to Seed to Slice</div>

    <h1>What's cooking today?</h1>

    <p>
        Print a receipt to find out what customers are ordering!
    </p>
</section>

<section class="printer">

    <div class="printer-top">
        <div class="printer-name">Customer order printer</div>
        <div class="printer-light"></div>
    </div>

    <div class="slot"></div>

    <div class="receipt-area">

        <div class="receipt" id="receipt">

            <div class="receipt-placeholder">
                <div class="placeholder-icon">🧾</div>

                <div class="placeholder-title">
                    Waiting for an order
                </div>

                <div class="placeholder-text">
                    Your customer's receipt<br>
                    will appear here.
                </div>
            </div>

        </div>

    </div>

    <div class="buttons">

        <button class="new-order" id="newOrder">
            Get New Order →
        </button>

        <button class="copy-order" id="copyOrder" disabled>
            Copy
        </button>

    </div>

    <div class="message" id="message"></div>

</section>

<footer>
    Made fresh at Seed to Slice<br>
</footer>

<script>

// Customer names used for randomized receipts.

const customers = [
    "Oliver",
    "Emma",
    "Noah",
    "Sophia",
    "Liam",
    "Ava",
    "Ethan",
    "Mia",
    "Lucas",
    "Isabella",
    "James",
    "Amelia"
];

// All recipes use ingredients available in the board game.
// Wheat is the pizza crust.

const orders = [

    {
        name: "The Garden Party",
        description: "A fresh and colourful pizza straight from the garden.",
        ingredients: [
            ["Wheat crust", 1],
            ["Tomato", 2],
            ["Basil", 1],
            ["Cheese", 1]
        ]
    },

    {
        name: "Mushroom Meadow",
        description: "A cozy mushroom pizza with plenty of cheese.",
        ingredients: [
            ["Wheat crust", 1],
            ["Mushroom", 2],
            ["Cheese", 2],
            ["Basil", 1]
        ]
    },

    {
        name: "The Classic Slice",
        description: "A timeless favourite. Simple, cheesy, and delicious.",
        ingredients: [
            ["Wheat crust", 1],
            ["Tomato", 2],
            ["Cheese", 2],
            ["Pepperoni", 1]
        ]
    },

    {
        name: "Forest Floor",
        description: "A woodland-inspired pizza with fresh garden toppings.",
        ingredients: [
            ["Wheat crust", 1],
            ["Mushroom", 2],
            ["Tomato", 1],
            ["Basil", 1]
        ]
    },

    {
        name: "Pepperoni Picnic",
        description: "A hearty pizza for someone with a big appetite.",
        ingredients: [
            ["Wheat crust", 1],
            ["Tomato", 1],
            ["Cheese", 1],
            ["Pepperoni", 2]
        ]
    },

    {
        name: "The Greenhouse",
        description: "Fresh garden ingredients with a cheesy finish.",
        ingredients: [
            ["Wheat crust", 1],
            ["Tomato", 1],
            ["Basil", 2],
            ["Mushroom", 1],
            ["Cheese", 1]
        ]
    },

    {
        name: "Sunset Special",
        description: "A savoury customer favourite with extra pepperoni.",
        ingredients: [
            ["Wheat crust", 1],
            ["Tomato", 2],
            ["Pepperoni", 2],
            ["Cheese", 1]
        ]
    },

    {
        name: "Forest & Flame",
        description: "Mushrooms and pepperoni make an unexpected pair.",
        ingredients: [
            ["Wheat crust", 1],
            ["Mushroom", 1],
            ["Pepperoni", 1],
            ["Tomato", 1],
            ["Cheese", 1]
        ]
    },

    {
        name: "Basil Breeze",
        description: "A light and fragrant pizza with fresh basil.",
        ingredients: [
            ["Wheat crust", 1],
            ["Basil", 2],
            ["Tomato", 2],
            ["Cheese", 1]
        ]
    },

    {
        name: "Farmer's Favourite",
        description: "A little bit of everything from the farm.",
        ingredients: [
            ["Wheat crust", 1],
            ["Tomato", 1],
            ["Basil", 1],
            ["Mushroom", 1],
            ["Cheese", 1],
            ["Pepperoni", 1]
        ]
    },

    {
        name: "Double Mushroom Melt",
        description: "A cheesy treat for serious mushroom lovers.",
        ingredients: [
            ["Wheat crust", 1],
            ["Mushroom", 3],
            ["Cheese", 2],
            ["Tomato", 1]
        ]
    },

    {
        name: "Market Day",
        description: "A colourful combination inspired by the local market.",
        ingredients: [
            ["Wheat crust", 1],
            ["Tomato", 2],
            ["Basil", 1],
            ["Pepperoni", 1],
            ["Cheese", 1]
        ]
    }

];

// Temporary display information only.
// Nothing is saved to a database or linked to a player.

let previousOrder = -1;
let orderNumber = 1;
let receiptText = "";

// Select a random order.
// Avoid repeating the previous pizza when possible.

function getRandomOrder() {

    let index = Math.floor(Math.random() * orders.length);

    while (
        orders.length > 1 &&
        index === previousOrder
    ) {
        index = Math.floor(Math.random() * orders.length);
    }

    previousOrder = index;

    return orders[index];
}

// Select a random customer.

function getRandomCustomer() {

    const index = Math.floor(
        Math.random() * customers.length
    );

    return customers[index];
}

// Generate and display a receipt.

function generateReceipt() {

    const order = getRandomOrder();
    const customer = getRandomCustomer();

    const number = String(orderNumber++)
        .padStart(3, "0");

    // Create the ingredient rows.

    const ingredientHTML = order.ingredients.map(
        ([ingredient, amount]) => {

            return `
                <div class="ingredient-row">
                    <span>${ingredient}</span>
                    <span class="ingredient-amount">× ${amount}</span>
                </div>
            `;

        }
    ).join("");

    // Build the receipt.

    const receipt = document.getElementById("receipt");

    receipt.className = "receipt print-animation";

    receipt.innerHTML = `

        <div class="receipt-header">

            <div class="receipt-logo">
                Seed to Slice 🍕
            </div>

            <div class="receipt-tagline">
                FRESHLY MADE AND DELICIOUS
            </div>

        </div>

        <div class="receipt-info">
            <span>ORDER #${number}</span>
            <span>TAKEAWAY</span>
        </div>

        <div class="customer">

            <div class="small-heading">
                CUSTOMER
            </div>

            <div class="customer-name">
                ${customer}
            </div>

        </div>

        <div class="small-heading">
            CUSTOMER'S ORDER
        </div>

        <div class="order-name">
            ${order.name}
        </div>

        <div class="order-description">
            ${order.description}
        </div>

        <div class="ingredients">

            <div class="small-heading">
                INGREDIENTS REQUIRED
            </div>

            ${ingredientHTML}

        </div>

        <div class="receipt-bottom">
            Thank you for choosing Seed to Slice!<br>
        </div>

    `;

    // Prepare the text for the Copy button.

    receiptText =
        `SEED TO SLICE — ORDER #${number}\n` +
        `Customer: ${customer}\n` +
        `${order.name}\n` +
        `${order.description}\n\n` +
        `INGREDIENTS:\n` +
        order.ingredients.map(
            ([name, amount]) => `${name} x ${amount}`
        ).join("\n");

    document.getElementById("copyOrder").disabled = false;

    document.getElementById("message").textContent =
        "Your new customer order is ready!";

    // Restart the printing animation.

    void receipt.offsetWidth;
}

// New order button.

document.getElementById("newOrder")
    .addEventListener("click", generateReceipt);

// Copy receipt button.

document.getElementById("copyOrder")
    .addEventListener("click", async () => {

        if (!receiptText) return;

        try {

            await navigator.clipboard.writeText(receiptText);

            document.getElementById("message").textContent =
                "Receipt copied successfully!";

        } catch {

            document.getElementById("message").textContent =
                "Copy is unavailable in this browser.";

        }

    });

</script>

</body>
</html>
